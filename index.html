<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <title>Family Stream</title>
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#0b021b" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Family Stream" />
        <link rel="apple-touch-icon" href="icon-192.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
        <link rel="icon" type="image/png" sizes="512x512" href="icon.png" />
        <!-- Inline on purpose: this is the first frame, before any stylesheet loads. -->
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
            }
            /* On body, not html: the root background propagates to the canvas and would
		   cover the AVPlay video plane. */
            body {
                background: #050505;
            }
            #splash {
                position: fixed;
                inset: 0;
                z-index: 100;
                display: grid;
                place-content: center;
                justify-items: center;
                gap: 30px;
                background-color: #050505;
                background-image:
                    linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
                background-size: 64px 64px;
                /* no rail in the splash, but the grid keeps its phase */
                background-position: var(--rail, 184px) center;
                font-family: "SamsungOne", "Samsung Sans", system-ui, sans-serif;
                transition: opacity 0.25s cubic-bezier(0.32, 0.72, 0, 1);
            }
            #splash.off {
                opacity: 0;
            }
            #splash .mark {
                font-size: 22px;
                font-weight: 700;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                background: linear-gradient(92deg, #febc06, #15e9a4);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
            #splash .bar {
                width: 200px;
                height: 3px;
                border-radius: 2px;
                background: rgba(255, 255, 255, 0.14);
                overflow: hidden;
            }
            #splash .bar i {
                display: block;
                width: 40%;
                height: 100%;
                border-radius: 2px;
                background: linear-gradient(90deg, #febc06, #15e9a4);
                animation: splash-slide 1.1s cubic-bezier(0.32, 0.72, 0, 1) infinite;
            }
            @keyframes splash-slide {
                from {
                    transform: translateX(-110%);
                }
                to {
                    transform: translateX(280%);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #splash .bar i {
                    animation: none;
                    width: 100%;
                    opacity: 0.5;
                }
            }
        </style>
        <link rel="stylesheet" href="css/tokens.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/lists.css" />
        <link rel="stylesheet" href="css/forms.css" />
        <link rel="stylesheet" href="css/player.css" />
        <link rel="stylesheet" href="css/overlays.css" />
        <link rel="stylesheet" href="css/media.css" />
        <link rel="stylesheet" href="css/access.css" />
        <link rel="stylesheet" href="css/android-theme.css" />
    </head>
    <body>
        <div id="splash">
            <span class="mark">Family Stream</span><span class="bar"><i></i></span>
        </div>
        <div id="videoSurface" class="video-surface hidden">
            <video id="videoPlayer" playsinline webkit-playsinline="true" x-webkit-airplay="allow" preload="auto"></video>
            <object
                class="av-surface"
                id="avPlayer"
                type="application/avplayer"
                width="1920"
                height="1080"
            ></object>
        </div>
        <div id="app"></div>
